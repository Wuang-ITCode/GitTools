<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trí - Tạo bài viết</title>
    <link rel="stylesheet" href="./post.css" />
  </head>
  <body>
    <div class="page-title">Trí - Tạo bài viết</div>

    <div class="canvas">
      <div class="modal">
        <button class="close-btn" aria-label="Đóng">
          <span>×</span>
        </button>

        <div class="modal-title">Tạo bài viết</div>
        <div class="title-divider"></div>

        <div class="composer">
          <div class="avatar"></div>
          <div class="input-pill">Chia sẻ suy nghĩ của bạn...</div>
          <div class="privacy-pill">
            <span class="globe-icon">🌐</span>
            <span>Công khai</span>
            <span class="caret">▾</span>
          </div>
        </div>

        <div class="action-row">
          <div class="action-icon image">
            <div class="stamp">
              <div class="stamp-dot"></div>
              <div class="stamp-dot"></div>
              <div class="stamp-dot"></div>
              <div class="stamp-dot"></div>
            </div>
            <div class="picture">
              <div class="sun"></div>
              <div class="mount"></div>
            </div>
          </div>
          <div class="action-icon tag">
            <div class="tag-body"></div>
            <div class="tag-hole"></div>
          </div>
          <div class="action-icon emoji">🙂</div>
          <div class="action-icon location">
            <div class="pin"></div>
          </div>
        </div>

        <button class="submit-btn">Đăng</button>
      </div>
    </div>
  </body>
</html>
