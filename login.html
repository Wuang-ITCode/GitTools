<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Bookstore</title>
    <th:block th:replace="~{layout :: link-css}"></th:block>
    <th:block th:replace="~{layout::custom-css}"></th:block>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .fade-in {
            animation: fadeIn 0.6s ease-out;
        }

        .slide-in-left {
            animation: slideInLeft 0.6s ease-out;
        }

        .float-animation {
            animation: float 3s ease-in-out infinite;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }

        .input-focus {
            transition: all 0.3s ease;
        }

        .input-focus:focus {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.2);
        }

        /* Google button hover effect */
        .google-btn {
            transition: all 0.3s ease;
        }

        .google-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(234, 67, 53, 0.3);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen">
    <th:block th:replace="~{layout :: header}"></th:block>
    
    <div class="container mx-auto px-4 py-12 min-h-screen flex items-center justify-center">
        <div class="w-full max-w-md">
            <!-- Login Card -->
            <div class="glass-effect rounded-3xl shadow-2xl overflow-hidden fade-in">
                <!-- Header Section -->
                <div class="bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 px-8 py-8 text-center">
                    <div class="inline-flex items-center justify-center w-20 h-20 bg-white rounded-full mb-4 float-animation shadow-lg">
                        <i class="fas fa-book-reader text-4xl text-indigo-600"></i>
                    </div>
                    <h1 class="text-3xl font-bold text-white mb-2">Chào mừng trở lại!</h1>
                    <p class="text-indigo-100 text-sm">Đăng nhập vào <strong>Bookstore</strong> của bạn</p>
                </div>

                <!-- Form Section -->
                <div class="p-8">
                    <!-- Alert Messages -->
                    <div th:if="${param.error}" 
                         class="mb-6 bg-red-50 border-l-4 border-red-500 rounded-xl p-4 slide-in-left">
                        <div class="flex items-center gap-3">
                            <i class="fas fa-exclamation-circle text-red-500 text-xl"></i>
                            <div>
                                <p class="font-semibold text-red-800">Đăng nhập thất bại!</p>
                                <p class="text-red-700 text-sm">Tên đăng nhập hoặc mật khẩu không đúng.</p>
                            </div>
                        </div>
                    </div>

                    <div th:if="${param.logout}" 
                         class="mb-6 bg-green-50 border-l-4 border-green-500 rounded-xl p-4 slide-in-left">
                        <div class="flex items-center gap-3">
                            <i class="fas fa-check-circle text-green-500 text-xl"></i>
                            <div>
                                <p class="font-semibold text-green-800">Đăng xuất thành công!</p>
                                <p class="text-green-700 text-sm">Bạn đã đăng xuất khỏi hệ thống.</p>
                            </div>
                        </div>
                    </div>

                    <!-- Divider -->
                    <div class="relative mb-6">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-gray-300"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-4 bg-white text-gray-500 font-medium">Hoặc đăng nhập với</span>
                        </div>
                    </div>

                    <!-- Login Form -->
                    <form th:action="@{/login}" method="post" class="space-y-5">
                        <!-- Username Input -->
                        <div>
                            <label for="username" class="block text-sm font-semibold text-gray-700 mb-2">
                                <i class="fas fa-user mr-2 text-indigo-600"></i>Tên đăng nhập
                            </label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <i class="fas fa-user text-gray-400"></i>
                                </div>
                                <input type="text" 
                                       id="username" 
                                       name="username" 
                                       required
                                       placeholder="Nhập tên đăng nhập"
                                       class="input-focus w-full pl-12 pr-4 py-3.5 border-2 border-gray-200 rounded-xl focus:border-indigo-500 focus:outline-none text-gray-800 font-medium">
                            </div>
                        </div>

                        <!-- Password Input -->
                        <div>
                            <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
                                <i class="fas fa-lock mr-2 text-indigo-600"></i>Mật khẩu
                            </label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <i class="fas fa-lock text-gray-400"></i>
                                </div>
                                <input type="password" 
                                       id="password" 
                                       name="password" 
                                       required
                                       placeholder="Nhập mật khẩu"
                                       class="input-focus w-full pl-12 pr-4 py-3.5 border-2 border-gray-200 rounded-xl focus:border-indigo-500 focus:outline-none text-gray-800 font-medium">
                            </div>
                        </div>

                        <!-- Remember Me & Forgot Password -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center">
                                <input type="checkbox" 
                                       id="remember-me" 
                                       name="remember-me"
                                       class="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                                <label for="remember-me" class="ml-2 text-sm text-gray-700 font-medium">
                                    Ghi nhớ đăng nhập
                                </label>
                            </div>
                            <a href="#" class="text-sm font-semibold text-indigo-600 hover:text-indigo-700 transition-colors">
                                Quên mật khẩu?
                            </a>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" 
                                class="w-full bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:from-indigo-700 hover:via-purple-700 hover:to-pink-700 text-white font-bold py-4 rounded-xl transition-all duration-300 transform hover:scale-[1.02] hover:shadow-2xl shadow-lg">
                            <i class="fas fa-sign-in-alt mr-2"></i>
                            Đăng nhập
                        </button>

                        <!-- Sign Up Link -->
                        <div class="text-center pt-4 border-t border-gray-200">
                            <p class="text-gray-600 text-sm">
                                Chưa có tài khoản? 
                                <a th:href="@{/register}" 
                                   class="font-bold text-indigo-600 hover:text-indigo-700 transition-colors">
                                    Đăng ký ngay
                                    <i class="fas fa-arrow-right ml-1"></i>
                                </a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Additional Info -->
            <div class="text-center mt-6">
                <p class="text-white text-sm opacity-90">
                    <i class="fas fa-shield-alt mr-2"></i>
                    Thông tin của bạn được bảo mật và mã hóa
                </p>
            </div>
        </div>
    </div>
    
    <!-- Decorative Elements -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden pointer-events-none -z-10">
        <div class="absolute top-20 left-10 w-72 h-72 bg-purple-400 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse"></div>
        <div class="absolute top-40 right-10 w-72 h-72 bg-pink-400 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse" style="animation-delay: 1s;"></div>
        <div class="absolute bottom-20 left-1/2 w-72 h-72 bg-indigo-400 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse" style="animation-delay: 2s;"></div>
    </div>
    
    <th:block th:replace="~{layout :: footer}"></th:block>

    <script>
        // Add subtle animation to inputs on focus
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', function() {
                this.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // Password visibility toggle (optional enhancement)
        const passwordInput = document.getElementById('password');
        const togglePassword = document.createElement('button');
        togglePassword.type = 'button';
        togglePassword.className = 'absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-gray-600';
        togglePassword.innerHTML = '<i class="fas fa-eye"></i>';
        
        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.querySelector('i').classList.toggle('fa-eye');
            this.querySelector('i').classList.toggle('fa-eye-slash');
        });
        
        passwordInput.parentElement.appendChild(togglePassword);
    </script>
</body>
</html>
